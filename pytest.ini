[tool:pytest]
# Pytest configuration for quick-colorlog

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    -ra

# Markers
markers =
    regression: Regression tests for specific fixed issues
    double_logging: Tests related to double logging prevention
    concurrency: Tests related to threading and concurrency
    cleanup: Tests related to resource cleanup
    slow: Tests that take a long time to run

# Minimum version
minversion = 6.0

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Add specific warnings to ignore if needed
